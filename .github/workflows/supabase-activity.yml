
name: Supabase Activity Check

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  database-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Query application files endpoint
        run: |
          curl --fail --show-error --silent \
            --retry 3 \
            --retry-delay 10 \
            --max-time 180 \
            "https://ai-deduplication-backend.onrender.com/api/files"
